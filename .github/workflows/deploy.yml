name: Deploy

# Publishing is deliberate, never a side effect of merging.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx astro sync

      - name: Build for Cloudflare
        run: npm run build:cf
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Publish
        run: npx wrangler deploy

      # The application reads its Supabase credentials from the Worker's own
      # environment at request time, not from the bundle. Syncing them here
      # keeps GitHub the single place those values are held.
      #
      # This runs after the deploy because a secret cannot be attached to a
      # Worker that does not exist yet. On the very first run the Worker is
      # therefore live for a few seconds without credentials, during which it
      # renders its "not configured" notice rather than failing.
      - name: Sync runtime secrets
        run: |
          printf '%s' "${{ secrets.SUPABASE_URL }}" | npx wrangler secret put SUPABASE_URL
          printf '%s' "${{ secrets.SUPABASE_KEY }}" | npx wrangler secret put SUPABASE_KEY

      - name: Report the public address
        run: npx wrangler deployments list --name 10x-study-planner || true
